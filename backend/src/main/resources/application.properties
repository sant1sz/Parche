spring.application.name=parche

# En desarrollo local se leen las variables del .env de la raíz del monorepo (si existe).
# En CI y producción llegan como variables de entorno reales.
spring.config.import=optional:file:../.env[.properties]

spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
server.port=${SERVER_PORT:8080}

# Base de datos: las credenciales solo llegan por variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parche}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo maneja solo Flyway. Hibernate únicamente lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
# Permite arrancar sin el perfil demo sobre una base que ya lo tuvo: la migración repetible
# de los datos demo queda en el historial pero no existe en db/migration.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

# Los errores de la API los arma exception/ManejadorErrores (RFC 9457).
# Para cualquier error que llegue fuera de Spring MVC: nunca exponer trazas ni mensajes internos.
server.error.include-stacktrace=never
server.error.include-message=never
